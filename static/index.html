<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美股概念板块实时行情看板</title>
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "light" ? "light" : "dark";</script>
</head>
<body>
  <header id="statusbar">
    <span class="title">美股板块看板</span>
    <span id="market-state" class="badge">--</span>
    <span id="view-tabs">
      <button type="button" data-mode="std" class="active">标准看板</button>
      <button type="button" data-mode="big">大字版</button>
    </span>
    <span>美东时间 <b id="et-time">--</b></span>
    <span>数据时间 <b id="data-time">--</b></span>
    <span id="stale-tip" class="stale hidden">数据可能滞后</span>
    <span class="spacer"></span>
    <span id="settings-wrap">
      <button id="settings-btn" type="button">⚙ 设置</button>
      <div id="settings-pop" class="hidden">
        <div class="pop-title">主题</div>
        <label><input type="radio" name="theme" value="dark"> 深色（默认）</label>
        <label><input type="radio" name="theme" value="light"> 浅色</label>
        <div class="pop-title" style="margin-top:10px">板块涨跌幅口径</div>
        <label><input type="radio" name="metric" value="regular"> 盘中涨跌幅（默认）</label>
        <label><input type="radio" name="metric" value="current"> 当前时段涨跌幅</label>
      </div>
    </span>
    <button id="export-btn" type="button">导出长图</button>
    <span id="refresh-hint">刷新 <b id="countdown">--</b>s</span>
  </header>

  <main>
    <section id="overview" class="cards"></section>

    <section id="bigview" class="hidden"></section>

    <section id="detail" class="hidden">
      <div class="detail-head">
        <h2 id="detail-title"></h2>
        <button id="detail-close">收起 ×</button>
      </div>
      <table id="detail-table">
        <thead>
          <tr>
            <th class="col-name">名称 / 代码</th>
            <th class="col-reason">入选理由</th>
            <th>最新价</th>
            <th data-period="regular">涨跌幅</th>
            <th data-period="pre">盘前价</th>
            <th data-period="pre">盘前%</th>
            <th data-period="post">盘后价</th>
            <th data-period="post">盘后%</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
